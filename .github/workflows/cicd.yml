
name: ML Model CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train and evaluate ML model
        run: python model.py

      - name: Run automated tests
        run: python -m pytest -v

      - name: Prepare GitHub Pages website
        run: |
          mkdir -p public
          python - <<'PY'
          from pathlib import Path

          accuracy = Path("accuracy.txt").read_text().strip()
          html = Path("index.html").read_text()
          html = html.replace("{{ACCURACY}}", accuracy)
          Path("public/index.html").write_text(html)
          PY

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  cd:
    name: Continuous Deployment
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check if GitHub Pages is enabled
        id: pages_status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status_code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pages")

          if [ "$status_code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled. Enable it in Settings > Pages."
          fi

      - name: Configure Pages
        if: steps.pages_status.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        if: steps.pages_status.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
